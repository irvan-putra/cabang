name: sign test apk
# Manual-only qualification workflow. Builds, tests, signs with the dedicated Cabang key and uploads a workflow artifact.
# It never creates a release, tag or commit.
on:
  workflow_dispatch:
    inputs:
      confirm_sign:
        description: Type SIGN to build and sign a test APK with the Cabang key
        required: true
        type: string
permissions:
  contents: read
jobs:
  sign:
    if: ${{ inputs.confirm_sign == 'SIGN' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Filled in only after the key exists: SHA-256 of the new certificate. Build fails while it is a placeholder.
      EXPECTED_CERT_SHA256: 3A25FED3E4B4CC1703934B14D86206880EDCF6B4ABD05F9E462B94F69A7CB158
      BUILD_TOOLS_VERSION: 34.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Pre-flight (fails before any build or secret use)
        run: |
          set -euo pipefail
          [[ $EXPECTED_CERT_SHA256 =~ ^[0-9A-F]{64}$ ]] || { echo "EXPECTED_CERT_SHA256 is not set to a real certificate digest"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          for t in apksigner zipalign aapt2; do [ -x "$bt/$t" ] || { echo "missing $t in build-tools $BUILD_TOOLS_VERSION"; exit 1; }; done
          V=$(sed -n "s/^ *versionName '\([0-9]*\.[0-9]*\.[0-9]*\)'.*/\1/p" android/app/build.gradle)
          [[ $V =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versionName not found"; exit 1; }
          icon=$(< tools/icon-version.txt)
          [[ $icon == "$V" ]] || { echo "tools/icon-version.txt ($icon) must equal versionName ($V); regenerate the icon"; exit 1; }
          grep -Fq "android:label=\"Cabang\"" android/app/src/main/AndroidManifest.xml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.10" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with: { gradle-version: "8.7" }
      - run: sh tools/fetch_core.sh
      - name: Test and build unsigned release
        run: cd android && gradle --no-daemon testDebugUnitTest :app:assembleRelease
      - name: Align, sign and verify
        env:
          CABANG_SIGNING_KEYSTORE_BASE64: ${{ secrets.CABANG_SIGNING_KEYSTORE_BASE64 }}
          CABANG_SIGNING_STORE_PASSWORD: ${{ secrets.CABANG_SIGNING_STORE_PASSWORD }}
          CABANG_SIGNING_KEY_PASSWORD: ${{ secrets.CABANG_SIGNING_KEY_PASSWORD }}
          CABANG_SIGNING_KEY_ALIAS: ${{ secrets.CABANG_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          in=android/app/build/outputs/apk/release/cabang-*-release.apk
          set -- $in; [ "$#" = 1 ]; unsigned="$1"
          ver=$(basename "$unsigned" | sed -n 's/^cabang-\(.*\)-release\.apk$/\1/p')
          [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          work=$(mktemp -d "$RUNNER_TEMP/cabang-sign.XXXXXX"); chmod 700 "$work"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$CABANG_SIGNING_KEYSTORE_BASE64" | base64 -d > "$work/k.jks"; chmod 600 "$work/k.jks"
          out="cabang-v${ver}.apk"
          "$bt/zipalign" -f -p 4 "$unsigned" "$work/aligned.apk"
          printf '%s\n%s\n' "$CABANG_SIGNING_STORE_PASSWORD" "$CABANG_SIGNING_KEY_PASSWORD" > "$work/pw"
          "$bt/apksigner" sign --ks "$work/k.jks" --ks-key-alias "$CABANG_SIGNING_KEY_ALIAS" \
            --ks-pass "file:$work/pw" --key-pass "file:$work/pw" \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --out "$out" "$work/aligned.apk"
          rm -f "$work/pw" "$out.idsig"
          "$bt/apksigner" verify --verbose --print-certs "$out" | tee verify.txt
          got=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' verify.txt | tr a-f A-F)
          [ "$got" = "$EXPECTED_CERT_SHA256" ]
          "$bt/aapt2" dump badging "$out" | sed -n "1p;/uses-permission/p;/native-code/p;/application-label:/p" | tee badging.txt
          grep -q "name='com.vanipy.cabang'" badging.txt
          grep -Fq "versionName='${ver}'" badging.txt
          [ "$(grep -c uses-permission badging.txt)" = 1 ]
          grep -q "android.permission.INTERNET" badging.txt
          grep -Fq "native-code: 'arm64-v8a'" badging.txt
          code=$(sed -n "s/^ *versionCode \([0-9][0-9]*\)\$/\1/p" android/app/build.gradle)
          [[ $code =~ ^[1-9][0-9]{0,8}$ ]]
          grep -Fq "versionCode='${code}'" badging.txt
          grep -Fq "application-label:'cabang'" badging.txt
          # Capture first: grep -q on a pipe can SIGPIPE the producer, and a negated pipeline is ignored by set -e.
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$out" > manifest.txt
          if grep -qi debuggable manifest.txt; then echo "APK is debuggable"; exit 1; fi
          sha256sum "$out" | tee "$out.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cabang-signed-test
          path: |
            cabang-v*.apk
            cabang-v*.apk.sha256
            verify.txt
            badging.txt
          if-no-files-found: error
